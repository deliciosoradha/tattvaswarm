[package]
name = "tattva-bench"
version = "0.1.0"
edition = "2021"
description = "Reproducible Taylor-Green benchmark harness for TattvaSwarm"
license = "Apache-2.0"

[[bin]]
name = "shiva"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 4
opt-level = 2
